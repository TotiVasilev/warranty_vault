name: warranty_vault
description: A private, offline warranty manager.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter_tesseract_ocr: 0.4.31
  flutter:
    sdk: flutter
  file_picker: 13.3.3
  path_provider: ^2.1.5
  pdfrx: 2.12.0
  image_picker: ^1.2.1
  uuid: ^4.5.1
  path: ^1.9.1
  flutter_edge_ai: 2.6.0
  flutter_edge_ai_litertlm: 1.20.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/tessdata_config.json
    - assets/tessdata/
    - assets/tessdata-LICENSE.txt
  uses-material-design: true
