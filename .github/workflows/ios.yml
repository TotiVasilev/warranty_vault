name: Warranty Vault iPhone build

on:
  push:
    branches: [ios-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check compatible iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [ "${sdk%%.*}" -ge 27 ]; then
            echo "This compatibility build needs an iOS SDK earlier than 27."
            exit 1
          fi
          echo "Building with iOS SDK $sdk"
      - name: Prepare iOS project and OCR assets
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios --no-pub .
          fi
          mkdir -p assets/tessdata
          for lang in eng bul deu nld fra spa ita ron pol por ell tur rus ukr; do
            file="assets/tessdata/$lang.traineddata"
            if [ ! -s "$file" ] || [ "$(wc -c < "$file" | tr -d ' ')" -lt 100000 ]; then
              curl --fail --location --retry 3 "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$lang.traineddata" -o "$file"
            fi
          done
          if [ ! -s assets/tessdata-LICENSE.txt ]; then
            curl --fail --location --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/LICENSE -o assets/tessdata-LICENSE.txt
          fi
          python3 - <<'PY'
          import json, plistlib, pathlib, re
          assets = pathlib.Path('assets')
          (assets/'tessdata_config.json').write_text(json.dumps({'files': [f'{x}.traineddata' for x in 'eng bul deu nld fra spa ita ron pol por ell tur rus ukr'.split()]}))
          plist = pathlib.Path('ios/Runner/Info.plist')
          with plist.open('rb') as f:
              data = plistlib.load(f)
          data['NSCameraUsageDescription'] = 'Take photos of warranty cards and receipts.'
          data['NSPhotoLibraryUsageDescription'] = 'Choose warranty and receipt photos to import.'
          data['CFBundleDisplayName'] = 'Warranty Vault'
          # Temporary compatibility path for the UIKit scene-startup crash.
          # The older SDK still permits the classic AppDelegate lifecycle.
          print('Original scene manifest:', repr(data.get('UIApplicationSceneManifest')))
          data.pop('UIApplicationSceneManifest', None)
          # Flutter recognizes this marker and does not re-run scene migration.
          data['_UIApplicationSceneManifest'] = {}
          data['UIMainStoryboardFile'] = 'Main'
          data['UILaunchStoryboardName'] = 'LaunchScreen'
          delegate = pathlib.Path('ios/Runner/AppDelegate.swift')
          if not delegate.is_file():
              raise SystemExit('Expected the standard Flutter Swift AppDelegate.')
          delegate.write_text("""import Flutter
          import UIKit

          @main
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          """)
          with plist.open('wb') as f:
              plistlib.dump(data, f, sort_keys=False)
          project = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text()
          text = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = ([\d.]+);', lambda m: 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' if float('.'.join(m[1].split('.')[:2])) < 15 else m[0], text)
          text = re.sub(r'INFOPLIST_KEY_UIApplicationSceneManifest_Generation\s*=\s*YES;', 'INFOPLIST_KEY_UIApplicationSceneManifest_Generation = NO;', text)
          project.write_text(text)
          podfile = pathlib.Path('ios/Podfile')
          if podfile.exists():
              text = podfile.read_text()
              pattern = r"(?m)^\s*#?\s*platform\s+:ios,\s*['\"]([\d.]+)['\"].*$"
              match = re.search(pattern, text)
              if match:
                  version = max(15.0, float('.'.join(match[1].split('.')[:2])))
                  text = re.sub(pattern, f"platform :ios, '{version}'", text, count=1)
              else:
                  text = "platform :ios, '15.0'\n" + text
              podfile.write_text(text)
          PY
      - name: Build unsigned iPhone app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-number=2
      - name: Package IPA for local signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wv/Payload"
          ditto build/ios/iphoneos/Runner.app "$RUNNER_TEMP/wv/Payload/Runner.app"
          # SwiftyTesseract also looks for a native app-bundle tessdata folder.
          ditto assets/tessdata "$RUNNER_TEMP/wv/Payload/Runner.app/tessdata"
          # Validate the actual packaged plist, not just the source file.
          python3 - "$RUNNER_TEMP/wv/Payload/Runner.app" <<'PY'
          import pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          p = app / 'Info.plist'
          with p.open('rb') as f:
              data = plistlib.load(f)
          print('Built scene manifest:', repr(data.get('UIApplicationSceneManifest')))
          sdk = data.get('DTSDKName', '')
          if not sdk.startswith('iphoneos') or int(sdk.removeprefix('iphoneos').split('.')[0]) >= 27:
              raise SystemExit(f'Unexpected SDK for compatibility build: {sdk}')
          data.pop('UIApplicationSceneManifest', None)
          data.pop('_UIApplicationSceneManifest', None)
          data['UIMainStoryboardFile'] = 'Main'
          assert (app / 'Base.lproj' / 'Main.storyboardc').is_dir() or (app / 'Main.storyboardc').is_dir(), 'Main storyboard missing'
          with p.open('wb') as f:
              plistlib.dump(data, f, fmt=plistlib.FMT_XML, sort_keys=False)
          with p.open('rb') as f:
              checked = plistlib.load(f)
          assert 'UIApplicationSceneManifest' not in checked
          assert checked['UIMainStoryboardFile'] == 'Main'
          print('Validated packaged legacy startup configuration:', sdk, checked.get('CFBundleVersion'))
          PY
          /usr/bin/plutil -lint "$RUNNER_TEMP/wv/Payload/Runner.app/Info.plist"
          cd "$RUNNER_TEMP/wv"
          /usr/bin/zip -q -r -y "$GITHUB_WORKSPACE/WarrantyVault-v2.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WarrantyVault-iPhone-v2
          path: WarrantyVault-v2.ipa
          if-no-files-found: error
